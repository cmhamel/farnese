[package]
name = "farnese"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
farnese-compiler = { path = "./farnese-compiler" }
#farnese-core = { path = "./farnese-core" }
# farnese-core-v3 = { path = "./farnese-core-v3" }
farnese-core-v4 = { path = "./farnese-core-v4" }
farnese-lexer = { path = "./farnese-lexer" }
#farnese-repl = { path = "./farnese-repl", optional = true }
# inkwell = { version = "0.6.0", features = ["llvm18-1"] }
inkwell = { version = "0.7.1", features = ["llvm18-1"] }

#[features]
#repl = [ "dep:farnese-repl" ]

[workspace]
# members = [".", "farnese-compiler", "farnese-core-v3", "farnese-lexer"]
members = [".", "farnese-core-v4", "farnese-lexer"]
